services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.2
    container_name: tram-es
    environment:
      - discovery.type=single-node
      # Aus .env im selben Verzeichnis (Vorlage: .env.example).
      # Achtung: greift nur beim allerersten Start eines leeren Volumes.
      # Bei bestehendem esdata-Volume ändert sich das Passwort dadurch NICHT —
      # dafür `elasticsearch-reset-password` benutzen, siehe PI_setup.md.
      - ELASTIC_PASSWORD=${ES_PASSWORD:?ES_PASSWORD fehlt - .env anlegen}
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false   # HTTP statt HTTPS lokal
      - ES_JAVA_OPTS=-Xms512m -Xmx512m           # RAM begrenzen (Laptop)
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u \"elastic:$${ELASTIC_PASSWORD}\" http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\\|yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 10

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.2
    container_name: tram-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_SYSTEM_PASSWORD:?KIBANA_SYSTEM_PASSWORD fehlt - .env anlegen}
    ports:
      - "5601:5601"
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  esdata:
